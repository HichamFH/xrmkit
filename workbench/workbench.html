<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xrmkit Workbench — HichamFH</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="workbench.css">
</head>
<body>
  <div id="scrim" class="scrim"></div>
  <aside>
    <div class="brand"><img src="../icons/logo.svg" alt=""><div><div class="logo">Xrmkit</div><div class="by">par HichamFH</div></div></div>
    <div id="org" class="small">Connexion…</div>
    <nav id="nav"></nav>
    <div class="credit"><span class="by-l">Développé par</span> <b>HichamFH</b><br>v0.8.2</div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <button id="menubtn" class="iconbtn" aria-label="Menu"><span data-i="menu"></span></button>
      <input id="navsearch" type="search" placeholder="Rechercher un outil…  ( / )" autocomplete="off">
      <span class="sp"></span>
      <button id="langBtn" class="iconbtn lang" aria-label="Langue"></button>
      <button id="bellBtn" class="iconbtn" aria-label="Notifications"><span data-i="bell"></span><b id="bellN" hidden>0</b></button>
      <button id="themeBtn" class="iconbtn" aria-label="Thème"><span data-i="moon"></span></button>
      <button id="userChip" class="userchip" aria-label="Utilisateur"><span class="avatar">…</span></button>
    </header>
    <main>
      <div id="banner" class="banner" hidden></div>
      <div id="view"></div>
    </main>
  </div>
  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="i18n-en.js"></script>
  <script src="charts.js"></script>
  <script src="logic.js"></script>
  <script src="office.js"></script>
  <script src="workbench.js"></script>
  <script src="helpers.js"></script>
  <script src="registry.js"></script>
  <script src="tabs-tech.js"></script>
  <script src="tabs-func.js"></script>
  <script src="tabs-data.js"></script>
  <script src="tabs-v05.js"></script>
  <script src="tabs-dash.js"></script>
  <script src="chat.js"></script>
  <script src="main.js"></script>
</body>
</html>
